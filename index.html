<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drive Mad - ArcadeHub</title>
    <!-- Links to your separate styles.css file -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">
            🕹️ <span>Drive Mad (200 Levels)</span>
        </div>
    </header>

    <div class="game-wrapper">
        <iframe id="game-element" 
            allowfullscreen="true" 
            allow="autoplay; fullscreen; camera; focus-without-user-activation *; monetization; gamepad; keyboard-map *; xr-spatial-tracking; clipboard-write; web-share; accelerometer; magnetometer; gyroscope; microphone *; screen-wake-lock" 
            name="gameFrame" 
            scrolling="no" 
            sandbox="allow-forms allow-modals allow-orientation-lock allow-pointer-lock allow-popups allow-popups-to-escape-sandbox allow-presentation allow-scripts allow-same-origin allow-downloads" 
            src="https://frogames.github.io/drive-mad/" 
            title="Drive Mad">
        </iframe>
    </div>

</body>
</html>
