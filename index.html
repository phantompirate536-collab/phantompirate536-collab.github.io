<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fancade Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 
      The sandbox attribute blocks popups, modal windows, and top-level navigation 
      while explicitly allowing scripts, pointer-locking, and same-origin execution 
      so the game functions normally without letting ad redirects break out.
    -->
    <iframe id="fancade" 
            src="https://play.fancade.com/5F084A0BCE06B710?max_w=2800&max_h=2800" 
            title="Fancade"
            sandbox="allow-scripts allow-same-origin allow-pointer-lock">
    </iframe>

    <script src="script.js"></script>
</body>
</html>
